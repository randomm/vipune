version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      # ort and ort-sys pin the same release of one repo and `ort` declares
      # exactly the matching `ort-sys`, so they must move in a single PR; they
      # get their own group and are excluded from rust-dependencies below.
      ort:
        patterns:
          - "ort"
          - "ort-sys"
      rust-dependencies:
        exclude-patterns:
          - "ort"
          - "ort-sys"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"
