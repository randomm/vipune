version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    # ort/ort-sys are pinned to =2.0.0-rc.9 for gline-rs compatibility (issue #53);
    # the pin pair must move together. Ignore is narrowed to the rc line so a
    # stable 2.0 (and security updates outside it) can still be proposed.
    ignore:
      - dependency-name: "ort"
        versions: ["2.0.0-rc.*"]
      - dependency-name: "ort-sys"
        versions: ["2.0.0-rc.*"]
    groups:
      rust-dependencies:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"
