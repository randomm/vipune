[package]
name = "vipune"
version = "0.20.1"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
repository = "https://github.com/randomm/vipune"
homepage = "https://github.com/randomm/vipune"
keywords = ["ai", "memory", "embeddings", "semantic-search", "cli"]
categories = ["command-line-utilities", "database", "api-bindings"]
readme = "README.md"
authors = ["Janni Turunen"]
description = "A minimal memory layer for AI agents"

[features]
default = ["mcp"]
mcp = ["dep:rmcp", "dep:tokio", "dep:schemars"]

[dependencies]
# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# Database
rusqlite = { version = "0.41", features = ["bundled", "backup"] }

# ONNX Runtime for embeddings (CPU-only; the build script downloads the prebuilt
# ONNX Runtime static library). Pinned to the rc series for the memory-safety/UB
# fixes rc.15 carries; stable 2.0.0 is not released. `ort` declares exactly the
# matching `ort-sys`, so the two pins move together — bump them in one edit.
#
# `default-features = false` + an explicit list, rather than the defaults: rc.15
# defaults to `tls-native`, which drags native-tls/openssl-sys (Linux),
# schannel (Windows) and security-framework (macOS) into the tree just to fetch
# the prebuilt ONNX Runtime at build time. rc.9's download stack was ureq 2 +
# rustls + webpki-roots, so `tls-rustls` keeps that: one TLS stack, no OpenSSL,
# and the `ring` provider ureq already resolves for hf-hub (no second provider,
# no aws-lc-rs). The remaining defaults are kept verbatim except `tracing`,
# which is off — nothing in this crate or the crate's own build script emits
# `tracing` events, and `tokenizers` uses its `tracing`/`tracing-subscriber`
# only in a doc example. `copy-dylibs` and `api-31` are kept as defaults even
# though the static build here may not need them: dropping them changes how the
# ORT library is linked and installed, and that is not this change. `ndarray`
# is dropped: no code in this crate constructs or extracts an `ndarray` tensor
# (`rg ndarray src/` is empty) — inputs are built from plain slices.
#
# `ort-sys` is declared separately (it is a build-dep of `ort` too, so it needs
# its own pin) and must not be given a TLS feature: it defaults to `std` +
# `api-17` only, and `ort` enables the matching `ort-sys` features from its own
# `tls-rustls`/`download-binaries`/`api-31` features.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-rustls", "copy-dylibs", "api-31"] }
ort-sys = "=2.0.0-rc.15"

# HuggingFace tokenizers and model download
tokenizers = "0.23.2"
hf-hub = { version = "0.5.0", default-features = false, features = ["ureq"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
# `std` only: 0.23 defaults to `std` + `simd-unsafe`; we decode untrusted import
# files so keep the safe scalar path that 0.22 gave us.
base64 = { version = "0.23", default-features = false, features = ["std"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
toml = "1.1"
dirs = "7"

# MCP server (optional, feature-gated)
# Floor is 3.7, the version src/mcp is written against (the 3.x router API and the
# CallToolResponse envelope `tools/call` returns). RUSTSEC-2026-0189 was already
# fixed at 1.4, so this floor is about the API, not the advisory.
# rmcp 3's `default` list pulls its optional `base64` feature, which would unify
# base64 0.23 back onto its default features — re-enabling `simd-unsafe`, the
# feature deny.toml denies because vipune decodes untrusted import files with that
# crate. vipune's stdio server uses none of the base64-gated helpers, so defaults
# stay off and only the features below are requested.
rmcp = { version = "3.7", default-features = false, features = ["server", "transport-io", "macros"], optional = true }
tokio = { version = "1", features = ["rt", "macros"], optional = true }
schemars = { version = "1", optional = true }

[lib]
name = "vipune"
path = "src/lib.rs"

[[bin]]
name = "vipune"
path = "src/main.rs"

# Criterion harness for Database::search (issue #183).
# `test = false` is required: bench targets default to `test = true`, which would
# build and run the bench binary during the default `cargo test` path and
# lengthen the CI Test job. `harness = false` is required by criterion.
[[bench]]
name = "db_search"
harness = false
test = false

[dev-dependencies]
criterion = "0.8"
tempfile = "3.13"
tokio = { version = "1", features = ["macros", "rt"] }

[profile.release]
strip = true
lto = true
codegen-units = 1

[profile.dist]
inherits = "release"
lto = "thin"
strip = true

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
allow-dirty = ["ci"]
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
# Which actions to run on pull requests
pr-run-mode = "upload"
# Where to install the binary (default: ~/.cargo/bin/)
install-path = "CARGO_HOME"

[workspace.metadata.dist.github-custom-runners]
aarch64-apple-darwin = "macos-14"
aarch64-unknown-linux-gnu = "ubicloud-standard-4-arm"
x86_64-unknown-linux-gnu = "ubicloud-standard-4"
global = "ubicloud-standard-2"
