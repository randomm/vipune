[changelog]
header = """
# Changelog\n
All notable changes to this project will be documented in this file.\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {{ commit.message | upper_first }}\
            {%- if commit.breaking_description | trim and commit.breaking_description != commit.message %}{{ "\n" }}    {{ commit.breaking_description | trim | indent(prefix="    ", first=false) }}\
            {%- endif %}\
    {% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# Keeps breaking commits from being dropped by any skip parser below; it does
# not choose their group.
protect_breaking_commits = true
commit_parsers = [
    # Parser position is what routes a breaking commit: git-cliff stops at the
    # first match, so this entry must stay first.
    # `^true$` matches git-cliff's stringified boolean for `breaking`.
    # The `<!-- 0 -->` prefix sorts the group first; striptags removes it.
    { field = "breaking", pattern = "^true$", group = "<!-- 0 -->⚠ Breaking Changes" },
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^doc", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^style", group = "Styling" },
    { message = "^test", group = "Testing" },
    { message = "^chore", group = "Miscellaneous" },
    { message = "^ci", group = "CI/CD" },
]
filter_commits = false
tag_pattern = "v[0-9].*"